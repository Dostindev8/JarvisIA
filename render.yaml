# Blueprint Render — backend JARVISIA (API + Socket.io)
#
# Si el servicio YA existe, render.yaml NO actualiza Settings solos.
# Dashboard → Settings debe quedar así (monorepo raíz):
#   Root Directory = (vacío)
#   Build Command  = npm run build:render
#   Start Command  = npm run start:render
#   Health Check   = /api/health
#
# Alternativa (Root Directory = server):
#   Build = npm install --no-audit --no-fund
#   Start = node index.js

services:
  - type: web
    name: jarvisia
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://jarvis-ia-pi.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: pNInz6obpgDQGcFmaJgB
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: SEED_DEMO_USER
        value: "true"
      - key: ALLOW_INMEMORY_DB
        value: "true"
      - key: DEMO_USER_EMAIL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
